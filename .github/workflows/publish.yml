name: publish

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry publishing
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || format('refs/tags/{0}', inputs.tag) }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Create version tag after merge
        if: github.event_name == 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.cjs tag
      - name: Select release tag
        id: version
        env:
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          tag="$RETRY_TAG"
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate release tag and prepare release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release.cjs
      - run: npm run check-formatting
      - run: npm run check-linting
      - run: npm run build
      - run: npm run test:ci -- --runInBand
      - run: node --test scripts/release.test.cjs
      - run: npm run package
      - name: Create draft release with package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" packed/*.tgz --clobber
          else
            gh release create "$TAG" packed/*.tgz --verify-tag --draft \
              --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Publish the packaged artifact to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "@mfbtech/changelog-generator" versions --json > "$RUNNER_TEMP/npm-versions.json"
          if node -e 'const versions = require(process.argv[1]); process.exit(versions.includes(process.argv[2]) ? 0 : 1)' "$RUNNER_TEMP/npm-versions.json" "$version"; then
            echo "Version already on npm; completing the GitHub release."
          else
            npm publish packed/*.tgz --access public
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
