name: publish

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      completed: ${{ steps.release.outputs.completed }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || format('refs/tags/{0}', inputs.tag) }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts
      - name: Select release tag
        id: version
        env:
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          tag="$RETRY_TAG"
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate release and prepare notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RELEASE_EVENT" = "pull_request" ]; then
            node scripts/release.cjs prepare
          else
            node scripts/release.cjs
          fi
      - if: steps.release.outputs.completed != 'true'
        run: npm run check-formatting
      - if: steps.release.outputs.completed != 'true'
        run: npm run check-linting
      - if: steps.release.outputs.completed != 'true'
        run: npm run build
      - if: steps.release.outputs.completed != 'true'
        run: npm run test:ci -- --runInBand
      - if: steps.release.outputs.completed != 'true'
        run: node --test scripts/*.test.cjs
      - if: steps.release.outputs.completed != 'true'
        run: npm run package
      - name: Stage release notes
        if: steps.release.outputs.completed != 'true'
        run: cp "$RUNNER_TEMP/release-notes.md" packed/release-notes.md
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.completed != 'true'
        id: artifact
        with:
          name: release-package-${{ github.run_attempt }}
          path: |
            packed/*.tgz
            packed/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.completed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || format('refs/tags/{0}', inputs.tag) }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2 --ignore-scripts
      # This job never installs project dependencies or executes the tarball.
      - name: Create version tag after successful build
        if: github.event_name == 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.cjs tag
      - name: Select release tag
        id: version
        env:
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          tag="$RETRY_TAG"
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Revalidate release tag and completion status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release.cjs verify
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.completed != 'true'
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: packed
          merge-multiple: true
      - name: Restore release notes
        if: steps.release.outputs.completed != 'true'
        run: cp packed/release-notes.md "$RUNNER_TEMP/release-notes.md"
      - name: Publish verified artifact and finalize release
        if: steps.release.outputs.completed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/publish.cjs
