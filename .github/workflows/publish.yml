name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag created after merging a version bump PR
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate release tag and prepare release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release.cjs
      - run: npm run check-formatting
      - run: npm run check-linting
      - run: npm run build
      - run: npm run test:ci -- --runInBand
      - run: node --test scripts/release.test.cjs
      - run: npm run package
      - name: Create draft release with package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" packed/*.tgz --clobber
          else
            gh release create "$TAG" packed/*.tgz --verify-tag --draft \
              --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Publish the packaged artifact to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "@mfbtech/changelog-generator" versions --json > "$RUNNER_TEMP/npm-versions.json"
          if node -e 'const versions = require(process.argv[1]); process.exit(versions.includes(process.argv[2]) ? 0 : 1)' "$RUNNER_TEMP/npm-versions.json" "$version"; then
            echo "Version already on npm; completing the GitHub release."
          else
            npm publish packed/*.tgz --access public
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
