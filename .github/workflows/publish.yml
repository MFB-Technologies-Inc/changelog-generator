name: publish

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry publishing
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || format('refs/tags/{0}', inputs.tag) }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - name: Create version tag after merge
        if: github.event_name == 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.cjs tag
      - name: Select release tag
        id: version
        env:
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          tag="$RETRY_TAG"
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate release tag and prepare release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release.cjs
      - if: steps.release.outputs.completed != 'true'
        run: npm run check-formatting
      - if: steps.release.outputs.completed != 'true'
        run: npm run check-linting
      - if: steps.release.outputs.completed != 'true'
        run: npm run build
      - if: steps.release.outputs.completed != 'true'
        run: npm run test:ci -- --runInBand
      - if: steps.release.outputs.completed != 'true'
        run: node --test scripts/*.test.cjs
      - if: steps.release.outputs.completed != 'true'
        run: npm run package
      - name: Publish verified artifact and finalize release
        if: steps.release.outputs.completed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/publish.cjs
