name: pr-build-pipeline

on:
  # Trigger analysis when pushing in main or pull requests, and when creating a pull request.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pr_build_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm 11
        run: npm install --global npm@11

      - name: Install packages
        run: npm install

      - name: Check formatting
        run: npm run check-formatting

      - name: Build project and dependencies
        run: npm run build

      - name: Run unit tests and generate report
        run: npm run test:ci

      - name: Test release validation and notes
        run: node --test scripts/*.test.cjs

      # No setup-java step here on purpose: sonarqube-scan-action@v8 downloads the
      # scanner CLI and runs it on its own provisioned JRE
      # (`${scannerDir}/jre/bin/java`), ignoring JAVA_HOME. The Java 21 requirement is
      # satisfied by the action version, not by the runner's Java.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # SonarCloud user/project analysis token
