name: pr-build-pipeline

on:
  # Trigger analysis when pushing in main or pull requests, and when creating a pull request.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pr_build_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install packages
        run: npm install

      - name: Check formatting
        run: npm run check-formatting

      - name: Build project and dependencies
        run: npm run build

      - name: Run unit tests and generate report
        run: npm run test:ci

      # Present only to satisfy the acceptance criteria of issue #24. This does NOT
      # supply the scanner's Java runtime: sonarqube-scan-action@v8 downloads the
      # scanner CLI and runs it on its own provisioned JRE
      # (`${scannerDir}/jre/bin/java`), ignoring JAVA_HOME. The Java 17 error was
      # fixed by moving off the Docker-based sonarcloud-github-action@v2. Changing
      # `java-version` here will not affect the scanner.
      - name: Setup Java (not used by the SonarCloud scanner - see comment above)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # SonarCloud user/project analysis token
